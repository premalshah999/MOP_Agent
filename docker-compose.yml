services:
  mop-agent:
    build:
      context: .
    image: mop-agent:latest
    restart: unless-stopped
    # A streamed answer can legitimately outlive Docker's 10-second default.
    # Let uvicorn drain it before the container is force-killed during deploys.
    stop_grace_period: 150s
    environment:
      # Local `.env` defaults to development; the production env file sets
      # APP_ENV=production and activates strict secret/origin validation.
      APP_ENV: ${APP_ENV:-development}
      APP_VERSION: ${APP_VERSION:-production}
      JWT_SECRET: ${JWT_SECRET:-change-me-before-public-use}
      JWT_EXPIRY_SECONDS: ${JWT_EXPIRY_SECONDS:-86400}
      SQLITE_DB_PATH: /app/data/runtime/mop.sqlite3
      DUCKDB_PATH: /app/data/runtime/mop.duckdb
      MAX_RETURN_ROWS: ${MAX_RETURN_ROWS:-250}
      QUERY_TIMEOUT_SECONDS: ${QUERY_TIMEOUT_SECONDS:-15}
      DEBUG_ERRORS: ${DEBUG_ERRORS:-false}
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-4}
      LOG_ROTATE_MAX_BYTES: ${LOG_ROTATE_MAX_BYTES:-10485760}
      LOG_ROTATE_KEEP: ${LOG_ROTATE_KEEP:-5}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_TRACES_RATE: ${SENTRY_TRACES_RATE:-0.05}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:8000,http://127.0.0.1:8000}
      TRUSTED_HOSTS: ${TRUSTED_HOSTS:-localhost,127.0.0.1}
      LLM_PROVIDER: ${LLM_PROVIDER:-deepseek}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_MODEL: ${LLM_MODEL:-}
      ASSISTANT_ROUTER_BASE_URL: ${ASSISTANT_ROUTER_BASE_URL:-}
      ASSISTANT_ROUTER_MODEL: ${ASSISTANT_ROUTER_MODEL:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-v4-flash}
      DEEPSEEK_THINKING_MODE: ${DEEPSEEK_THINKING_MODE:-disabled}
      DEEPSEEK_REASONING_EFFORT: ${DEEPSEEK_REASONING_EFFORT:-high}
      DEEPSEEK_MIN_COMPLETION_TOKENS: ${DEEPSEEK_MIN_COMPLETION_TOKENS:-4096}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash-lite}
      GEMINI_REASONING_EFFORT: ${GEMINI_REASONING_EFFORT:-minimal}
      GEMINI_MIN_COMPLETION_TOKENS: ${GEMINI_MIN_COMPLETION_TOKENS:-512}
      LLM_TIMEOUT: ${LLM_TIMEOUT:-12}
      LLM_RETRIES: ${LLM_RETRIES:-2}
      GRACEFUL_SHUTDOWN_TIMEOUT: ${GRACEFUL_SHUTDOWN_TIMEOUT:-135}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
    ports:
      - "127.0.0.1:${MOP_AGENT_PORT:-8000}:8000"
    volumes:
      - mop_agent_runtime:/app/data/runtime

volumes:
  mop_agent_runtime:
