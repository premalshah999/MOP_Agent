# Verified Query Repository
# ==========================
# Hand-curated (question, blessed SQL) pairs. When a user's question matches
# any entry's `question` or `paraphrases` above the configured similarity
# threshold (see app/core/verified_queries.py), the orchestrator skips the
# LLM SQL-generation stage entirely and uses the blessed SQL directly. The
# answer is then composed by the normal answer-writer pipeline so it still
# reads naturally — but the underlying SQL is provably correct, no
# hallucination surface at the data-retrieval stage.
#
# `verified: true` means an analyst reviewed and signed off. Only verified
# entries are used for matching. Entries with `verified: false` are
# bootstrap stubs — review them, fix if needed, flip the flag.
#
# Add new entries by appending to the list. Numeric `id` is for cross-
# reference in logs and the admin dashboard; keep them unique.

- id: vq001
  question: "what was Maryland's median household income in 2023?"
  paraphrases:
    - "median household income in maryland 2023"
    - "maryland household income"
    - "average household income in maryland"
  table: acs_state
  sql: |
    SELECT state, "Median household income"
    FROM mart_acs_state
    WHERE LOWER(state) = 'maryland' AND Year = 2023
  verified: true
  notes: "Direct ACS 1-year estimate lookup."

- id: vq002
  question: "top 5 states by median household income in 2023"
  paraphrases:
    - "highest median household income states"
    - "richest states by household income"
    - "top states by median income 2023"
  table: acs_state
  sql: |
    SELECT state, "Median household income"
    FROM mart_acs_state
    WHERE Year = 2023 AND "Median household income" IS NOT NULL
    ORDER BY "Median household income" DESC
    LIMIT 5
  verified: true
  notes: "Includes DC + PR; 'state' column case is lowercase."

- id: vq003
  question: "what was Maryland's poverty rate in 2023?"
  paraphrases:
