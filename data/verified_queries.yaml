    SELECT state, "Below poverty" AS poverty_rate
    FROM mart_acs_state
    WHERE LOWER(state) = 'maryland' AND Year = 2023
  verified: true
  notes: "ACS 'Below poverty' is a percentage, not a count."

- id: vq004
  question: "top 10 counties in maryland by grants"
  paraphrases:
    - "best counties in maryland for grants"
    - "highest-grant counties in maryland"
    - "top maryland counties federal grants"
  table: contract_county
  sql: |
    SELECT county, "Grants"
    FROM mart_contract_county
