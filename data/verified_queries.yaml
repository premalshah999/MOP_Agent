- id: vq041
  question: "how much did the department of defense spend in maryland in 2024?"
  paraphrases:
    - "DoD spending in maryland 2024"
    - "department of defense contracts to maryland 2024"
    - "how much federal defense money went to maryland"
  table: spending_state_agency
  sql: |
    SELECT state, Contracts, Grants, "Direct Payments"
    FROM mart_spending_state_agency
    WHERE agency = 'Department of Defense'
      AND LOWER(state) = 'maryland'
      AND year = '2024'
  verified: true
  notes: "spending_state_agency stores year as STRING and state in UPPERCASE — LOWER() the state literal for match; year '2024' is FY2024 single-year, '2020-2024' is the 5-year aggregate row."
