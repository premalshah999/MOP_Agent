- id: vq009
  question: "subcontract inflow to maryland"
  paraphrases:
    - "total subaward money flowing into maryland"
    - "subaward inflow maryland"
    - "money flowing into maryland from subcontracts"
  table: state_flow
  sql: |
    SELECT 'Maryland' AS destination,
           SUM(subaward_amount_year) AS total_subaward_inflow,
           COUNT(*) AS source_count
    FROM mart_state_flow
    WHERE LOWER(subawardee_state_name) = 'maryland'
  verified: true
  notes: "Inflow TO Maryland = where the SUBAWARDEE (recipient of the subaward) is based in MD. Returns the scalar total; breakdown variant lives as a follow-up question, not the headline."

- id: vq010
  question: "top counties in maryland with maximum funding"
  paraphrases:
    - "top funded counties in maryland"
    - "highest funded counties in maryland"
    - "biggest grant counties in md"
  table: contract_county
  sql: |
    SELECT county,
           ("Grants" + "Contracts" + "Direct Payments") AS total_funding
    FROM mart_contract_county
    WHERE LOWER(state) = 'maryland' AND year = '2024'
      AND "Grants" IS NOT NULL
    ORDER BY total_funding DESC
    LIMIT 10
  verified: true
  notes: "Maximum funding = grants + contracts + direct payments combined."

