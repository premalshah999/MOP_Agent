version: 1

# Four difficult, answerable questions for every physical table (1-68),
# twenty cross-dataset analyses (69-88), and four three-turn conversations
# (89-100). Expectations grade semantic intent; numeric prose is independently
# checked against executed rows by the pipeline's blocking faithfulness judge.
cases:
